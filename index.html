<!DOCTYPE html>

<body>

  <main class="watch">

```
<header>
  <div class="logo">BOBOS</div>
  <div class="status-dot"></div>
</header>

<section class="time-section">
  <div id="clock">12:00</div>
  <div id="date">Loading...</div>
</section>

<section class="dashboard">

  <div class="card projects">
    <div class="icon">📁</div>
    <div>
      <span>PROJECTS</span>
      <strong>7</strong>
    </div>
  </div>

  <div class="card games">
    <div class="icon">🎮</div>
    <div>
      <span>GAMES</span>
      <strong>3</strong>
    </div>
  </div>

  <div class="card website">
    <div class="icon">🌐</div>
    <div>
      <span>WEBSITE</span>
      <strong>ONLINE</strong>
    </div>
  </div>

</section>

<section class="quick-actions">

  <button onclick="refreshPage()">
    <span>↻</span>
    Refresh
  </button>

  <button onclick="showMessage()">
    <span>⚡</span>
    BOBOS
  </button>

</section>

<div id="message"></div>

<footer>
  BOBOS WATCH v2
</footer>
